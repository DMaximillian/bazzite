name: Build Bazzite Deck G1 ISO (44.20260820, fast new installer)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-g1-fast
  cancel-in-progress: true

jobs:
  build-g1-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      BASE_TAG: "44.20260820"
      ISO_NAME: "bazzite-deck-g1-44.20260820-live-amd64.iso"

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Mount Container Storage BTRFS Loopback
        shell: bash
        run: |
          set -euxo pipefail
          sudo truncate -s 110G /mnt/podman-storage.img
          sudo mkfs.btrfs -f -m single -d single /mnt/podman-storage.img
          sudo podman system reset --force
          sudo systemctl stop podman.service || true
          LOOP=$(sudo losetup --find --show --direct-io=on /mnt/podman-storage.img)
          sudo mkdir -p /mnt/podman-storage
          sudo mount -o compress-force=zstd:2,discard=async,noatime "$LOOP" /mnt/podman-storage
          sudo mkdir -p /mnt/podman-storage/storage /mnt/podman-storage/tmp
          sudo mount --bind /mnt/podman-storage/storage /var/lib/containers/storage
          sudo systemctl start podman.service || true
          sudo df -h
          sudo du -sh /mnt/podman-storage.img

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Prepare custom installer
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf installer-g1
          cp -a installer installer-g1

          mkdir -p g1-files
          mkdir -p installer-g1/system_files/overrides/usr/share/bazzite-g1
          mkdir -p installer-g1/system_files/overrides/usr/lib/udev/hwdb.d
          mkdir -p installer-g1/system_files/overrides/usr/lib/udev/rules.d
          mkdir -p installer-g1/system_files/overrides/usr/local/bin
          mkdir -p installer-g1/system_files/overrides/usr/lib/systemd/system
          mkdir -p installer-g1/system_files/overrides/usr/lib/systemd/system/multi-user.target.wants
          mkdir -p installer-g1/system_files/overrides/usr/etc

          cat > g1-files/61-sensor-local.hwdb <<'EOF'
          # OneXPlayer G1 A — bmi260 accelerometer is mounted 180° vs the panel.
          sensor:modalias:acpi:BMI0160*:dmi:*:svnONE-NETBOOK:pnONEXPLAYERG1A:*
           ACCEL_MOUNT_MATRIX=-1, 0, 0; 0, -1, 0; 0, 0, 1
          EOF

          cat > g1-files/62-amira-kbd-fkeys.hwdb <<'EOF'
          # AMIRA keyboard mode-toggle emits spurious F13/F14/F17.
          evdev:input:b0003v6080p8060*
           KEYBOARD_KEY_70068=reserved
           KEYBOARD_KEY_70069=reserved
           KEYBOARD_KEY_7006c=reserved
          EOF

          cat > g1-files/71-controller-access.rules <<'EOF'
          SUBSYSTEM=="input", ENV{ID_INPUT_JOYSTICK}=="1", TAG+="uaccess", MODE="0660", GROUP="input"
          KERNEL=="js[0-9]*", SUBSYSTEM=="input", TAG+="uaccess", MODE="0660", GROUP="input"
          EOF

          cat > g1-files/99-usb-autosuspend.rules <<'EOF'
          ACTION=="add", SUBSYSTEM=="usb", ATTR{idVendor}=="05e3", ATTR{idProduct}=="0610", ATTR{power/control}="on", ATTR{power/autosuspend_delay_ms}="0"
          ACTION=="add", SUBSYSTEM=="usb", ATTR{bDeviceClass}=="09", ATTR{power/control}="on"
          ACTION=="add", SUBSYSTEM=="usb", ATTR{idVendor}=="6080", ATTR{idProduct}=="8060", ATTR{power/control}="on", ATTR{power/autosuspend_delay_ms}="0"
          EOF

          cat > g1-files/usb-hub-poweron.sh <<'EOF'
          #!/usr/bin/bash
          set -euo pipefail
          udevadm settle --timeout=60 || true
          for d in /sys/bus/usb/devices/*/power/control; do
              echo on > "$d" 2>/dev/null || true
          done
          EOF

          cat > g1-files/usb-hub-poweron.service <<'EOF'
          [Unit]
          Description=Wait for USB devices then force hubs to stay powered
          Before=gdm.service display-manager.service
          After=systemd-udevd.service

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/local/bin/usb-hub-poweron.sh

          [Install]
          WantedBy=multi-user.target
          EOF

          cat > g1-files/oxp-rgb.py <<'EOF'
          #!/usr/bin/env python3
          import configparser
          import glob
          import os
          import sys
          import time

          CONF = "/etc/oxp-rgb.conf"
          VID, PID = "1A2C", "B001"
          EFFECTS = {
              "aurora": 0x01, "flowing": 0x03, "neon": 0x05, "dreamy": 0x07,
              "sun": 0x08, "cyberpunk": 0x09, "sunset": 0x0B,
              "colorful": 0x0C, "monster_woke": 0x0D,
          }
          BRIGHT = {"low": 0x01, "medium": 0x03, "high": 0x04}

          def gen_cmd(cid, cmd, idx=0x01, size=64):
              base = bytes([cid, 0x3F, idx]) + bytes(cmd)
              return base + bytes([0] * (size - len(base) - 2)) + bytes([0x3F, cid])

          def gen_brightness(side, enabled, bc):
              return gen_cmd(0xB8, [0xFD, side, 0x02, 1 if enabled else 0, 0x05, bc])

          def gen_rgb_solid(r, g, b, side=0):
              return gen_cmd(0xB8, [0xFE, side, 0x02] + 18 * [r, g, b] + [r, g])

          def gen_rgb_mode(mc):
              return gen_cmd(0xB8, [mc, 0x00, 0x02])

          def find_dev():
              for hr in sorted(glob.glob("/sys/class/hidraw/hidraw*")):
                  try:
                      uevent = open(os.path.join(hr, "device/uevent")).read().upper()
                  except OSError:
                      continue
                  if VID in uevent and PID in uevent:
                      return "/dev/" + os.path.basename(hr)
              return None

          def main():
              config = configparser.ConfigParser()
              config.read(CONF)
              rgb = config["rgb"] if config.has_section("rgb") else {}
              mode = rgb.get("mode", "effect")
              bc = BRIGHT.get(rgb.get("brightness", "high"), 0x04)

              dev = find_dev()
              if not dev:
                  print("OXP RGB device not found", file=sys.stderr)
                  sys.exit(1)

              fd = os.open(dev, os.O_RDWR)

              def write_cmd(cmd):
                  os.write(fd, bytes(cmd))
                  time.sleep(0.08)

              write_cmd(gen_brightness(0, True, bc))
              if mode == "solid":
                  r = int(rgb.get("r", 0))
                  g = int(rgb.get("g", 255))
                  b = int(rgb.get("b", 0))
                  for side in (0x00, 0x01, 0x02):
                      write_cmd(gen_rgb_solid(r, g, b, side=side))
              else:
                  effect = rgb.get("effect", "aurora")
                  write_cmd(gen_rgb_mode(EFFECTS.get(effect, 0x01)))

              os.close(fd)

          if __name__ == "__main__":
              main()
          EOF

          cat > g1-files/oxp-rgb.conf <<'EOF'
          [rgb]
          mode = effect
          effect = aurora
          brightness = high
          r = 0
          g = 255
          b = 0
          EOF

          cat > g1-files/oxp-rgb-apply.sh <<'EOF'
          #!/usr/bin/bash
          set -euo pipefail
          for _ in $(seq 1 30); do
              if /usr/local/bin/oxp-rgb.py; then
                  exit 0
              fi
              sleep 2
          done
          exit 0
          EOF

          cat > g1-files/oxp-rgb.service <<'EOF'
          [Unit]
          Description=OneXPlayer G1 controller RGB workaround
          After=graphical.target
          Wants=graphical.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/oxp-rgb-apply.sh
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
          EOF

          chmod 0755 g1-files/usb-hub-poweron.sh g1-files/oxp-rgb.py g1-files/oxp-rgb-apply.sh

          install -m 0644 g1-files/61-sensor-local.hwdb installer-g1/system_files/overrides/usr/share/bazzite-g1/61-sensor-local.hwdb
          install -m 0644 g1-files/62-amira-kbd-fkeys.hwdb installer-g1/system_files/overrides/usr/share/bazzite-g1/62-amira-kbd-fkeys.hwdb
          install -m 0644 g1-files/71-controller-access.rules installer-g1/system_files/overrides/usr/share/bazzite-g1/71-controller-access.rules
          install -m 0644 g1-files/99-usb-autosuspend.rules installer-g1/system_files/overrides/usr/share/bazzite-g1/99-usb-autosuspend.rules
          install -m 0755 g1-files/usb-hub-poweron.sh installer-g1/system_files/overrides/usr/share/bazzite-g1/usb-hub-poweron.sh
          install -m 0644 g1-files/usb-hub-poweron.service installer-g1/system_files/overrides/usr/share/bazzite-g1/usb-hub-poweron.service
          install -m 0755 g1-files/oxp-rgb.py installer-g1/system_files/overrides/usr/share/bazzite-g1/oxp-rgb.py
          install -m 0755 g1-files/oxp-rgb-apply.sh installer-g1/system_files/overrides/usr/share/bazzite-g1/oxp-rgb-apply.sh
          install -m 0644 g1-files/oxp-rgb.service installer-g1/system_files/overrides/usr/share/bazzite-g1/oxp-rgb.service
          install -m 0644 g1-files/oxp-rgb.conf installer-g1/system_files/overrides/usr/share/bazzite-g1/oxp-rgb.conf

          install -m 0644 g1-files/61-sensor-local.hwdb installer-g1/system_files/overrides/usr/lib/udev/hwdb.d/61-sensor-local.hwdb
          install -m 0644 g1-files/62-amira-kbd-fkeys.hwdb installer-g1/system_files/overrides/usr/lib/udev/hwdb.d/62-amira-kbd-fkeys.hwdb
          install -m 0644 g1-files/71-controller-access.rules installer-g1/system_files/overrides/usr/lib/udev/rules.d/71-controller-access.rules
          install -m 0644 g1-files/99-usb-autosuspend.rules installer-g1/system_files/overrides/usr/lib/udev/rules.d/99-usb-autosuspend.rules
          install -m 0755 g1-files/usb-hub-poweron.sh installer-g1/system_files/overrides/usr/local/bin/usb-hub-poweron.sh
          install -m 0644 g1-files/usb-hub-poweron.service installer-g1/system_files/overrides/usr/lib/systemd/system/usb-hub-poweron.service
          install -m 0755 g1-files/oxp-rgb.py installer-g1/system_files/overrides/usr/local/bin/oxp-rgb.py
          install -m 0755 g1-files/oxp-rgb-apply.sh installer-g1/system_files/overrides/usr/local/bin/oxp-rgb-apply.sh
          install -m 0644 g1-files/oxp-rgb.service installer-g1/system_files/overrides/usr/lib/systemd/system/oxp-rgb.service
          install -m 0644 g1-files/oxp-rgb.conf installer-g1/system_files/overrides/usr/etc/oxp-rgb.conf

          ln -sf ../usb-hub-poweron.service installer-g1/system_files/overrides/usr/lib/systemd/system/multi-user.target.wants/usb-hub-poweron.service
          ln -sf ../oxp-rgb.service installer-g1/system_files/overrides/usr/lib/systemd/system/multi-user.target.wants/oxp-rgb.service

          cat >> installer-g1/build.sh <<'EOF'

          cat <<'KSEOF' >/usr/share/anaconda/post-scripts/g1-fixes.ks
          %post --nochroot --erroronfail --log=/tmp/anacoda_custom_logs/g1-fixes.log
          set -euxo pipefail

          SRC=/usr/share/bazzite-g1
          SYSROOT=/mnt/sysroot

          install -D -m 0644 "$SRC/61-sensor-local.hwdb" "$SYSROOT/usr/lib/udev/hwdb.d/61-sensor-local.hwdb"
          install -D -m 0644 "$SRC/62-amira-kbd-fkeys.hwdb" "$SYSROOT/usr/lib/udev/hwdb.d/62-amira-kbd-fkeys.hwdb"
          install -D -m 0644 "$SRC/71-controller-access.rules" "$SYSROOT/usr/lib/udev/rules.d/71-controller-access.rules"
          install -D -m 0644 "$SRC/99-usb-autosuspend.rules" "$SYSROOT/usr/lib/udev/rules.d/99-usb-autosuspend.rules"

          install -D -m 0755 "$SRC/usb-hub-poweron.sh" "$SYSROOT/usr/local/bin/usb-hub-poweron.sh"
          install -D -m 0644 "$SRC/usb-hub-poweron.service" "$SYSROOT/usr/lib/systemd/system/usb-hub-poweron.service"

          install -D -m 0755 "$SRC/oxp-rgb.py" "$SYSROOT/usr/local/bin/oxp-rgb.py"
          install -D -m 0755 "$SRC/oxp-rgb-apply.sh" "$SYSROOT/usr/local/bin/oxp-rgb-apply.sh"
          install -D -m 0644 "$SRC/oxp-rgb.service" "$SYSROOT/usr/lib/systemd/system/oxp-rgb.service"
          install -D -m 0644 "$SRC/oxp-rgb.conf" "$SYSROOT/usr/etc/oxp-rgb.conf"

          mkdir -p "$SYSROOT/usr/lib/systemd/system/multi-user.target.wants"
          ln -sf ../usb-hub-poweron.service "$SYSROOT/usr/lib/systemd/system/multi-user.target.wants/usb-hub-poweron.service"
          ln -sf ../oxp-rgb.service "$SYSROOT/usr/lib/systemd/system/multi-user.target.wants/oxp-rgb.service"

          mkdir -p "$SYSROOT/boot/efi/EFI/BOOT"
          cat > "$SYSROOT/boot/efi/EFI/BOOT/grub.cfg" <<'GRUBEOF'
          search --no-floppy --file --set=root /EFI/fedora/grub.cfg
          configfile ($root)/EFI/fedora/grub.cfg
          GRUBEOF

          if [ -f "$SYSROOT/boot/efi/EFI/fedora/shimx64.efi" ]; then
            cp -f "$SYSROOT/boot/efi/EFI/fedora/shimx64.efi" "$SYSROOT/boot/efi/EFI/BOOT/BOOTX64.EFI"
          elif [ -f "$SYSROOT/boot/efi/EFI/fedora/grubx64.efi" ]; then
            cp -f "$SYSROOT/boot/efi/EFI/fedora/grubx64.efi" "$SYSROOT/boot/efi/EFI/BOOT/BOOTX64.EFI"
          fi

          chroot "$SYSROOT" bash -lc 'systemd-hwdb update || udevadm hwdb --update || true'
          %end
          KSEOF

          echo '%include /usr/share/anaconda/post-scripts/g1-fixes.ks' >> /usr/share/anaconda/interactive-defaults.ks
          EOF

      - name: Build live installer payload
        shell: bash
        run: |
          set -euxo pipefail
          BASE_IMAGE="ghcr.io/ublue-os/bazzite:${BASE_TAG}"
          INSTALL_IMAGE_PAYLOAD="ghcr.io/ublue-os/bazzite-deck:${BASE_TAG}"
          FLATPAK_DIR_SHORTNAME="kde_flatpaks"

          sudo env TMPDIR=/mnt/podman-storage/tmp podman build \
            --cap-add sys_admin \
            --security-opt label=disable \
            --build-arg BASE_IMAGE="${BASE_IMAGE}" \
            --build-arg INSTALL_IMAGE_PAYLOAD="${INSTALL_IMAGE_PAYLOAD}" \
            --build-arg FLATPAK_DIR_SHORTNAME="${FLATPAK_DIR_SHORTNAME}" \
            -t localhost/payload:latest \
            installer-g1/

      - name: Quick verify payload
        shell: bash
        run: |
          set -euxo pipefail
          sudo podman image inspect localhost/payload:latest > payload-image.json
          jq -r '.[0].RepoTags[0]' payload-image.json
          sudo podman run --rm localhost/payload:latest test -f /usr/lib/bootc-image-builder/iso.yaml
          sudo podman run --rm localhost/payload:latest test -f /usr/share/anaconda/post-scripts/g1-fixes.ks

      - name: Build ISO with New Installer
        uses: Zeglius/titanoboa@revamp-pr
        id: build
        with:
          image-ref: localhost/payload:latest
          iso-dest: ${{ env.ISO_NAME }}

      - name: Verify built ISO
        shell: bash
        run: |
          set -euxo pipefail
          test -f "${{ steps.build.outputs.iso-dest }}"
          file "${{ steps.build.outputs.iso-dest }}"
          sha256sum "${{ steps.build.outputs.iso-dest }}" | tee "${{ steps.build.outputs.iso-dest }}-CHECKSUM"

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "bazzite-deck-g1-44.20260820-live-iso"
          path: |
            ${{ steps.build.outputs.iso-dest }}
            ${{ steps.build.outputs.iso-dest }}-CHECKSUM
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true
